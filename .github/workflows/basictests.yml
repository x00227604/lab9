name: Lab 9 Basic Tests

on:
  push:
    branches:
      - main
      - test

jobs:
  lab9-basic-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make validate-data.sh executable
        run: chmod +x ./validate-data.sh

      - name: Test 1 - Valid name and mobile number (Expected PASS)
        run: |
          result=$(./validate-data.sh "ali osman" 0899999999)
          echo "Result: $result"
          [ "$result" = "PASS" ]

      - name: Test 2 - Name longer than 20 chars (Expected FAIL)
        run: |
          result=$(./validate-data.sh "AlexanderTheGreatOfMacedon" 0899999999)
          echo "Result: $result"
          [ "$result" = "FAIL" ]

      - name: Test 3 - Mobile number longer than 10 chars (Expected FAIL)
        run: |
          result=$(./validate-data.sh "ali osman" 089999999912)
          echo "Result: $result"
          [ "$result" = "FAIL" ]

